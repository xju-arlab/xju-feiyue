<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作业 · 飞跃</title><style>__TOKENS__
__CSS__
__FINAL_CSS__</style></head><body data-mode="__MODE__">
<div class="prototype-bar"><span class="label">FEIYUE / 交互预览</span><div class="segmented" id="mode-switch" aria-label="预览身份"></div><button class="reset" onclick="restart()">__RESET_ICON__ 重置</button></div>
<header class="navbar"><div class="navbar-inner"><span class="row muted" style="gap:6px">__BACK_ICON__<span class="back-label small">返回 Feiyue</span></span><span class="faint">·</span><span class="row" style="gap:6px">__CLASS_ICON__<strong class="brand-label" style="font-size:13px;font-weight:500">分组任务</strong></span><nav class="nav-links" aria-label="任务导航"><span class="nav-item">概览</span><span class="nav-item active" aria-current="page">作业</span><span class="nav-item">点名</span><span class="nav-item">成员</span></nav><div class="row identity" style="margin-left:auto;gap:7px"><span class="avatar green" id="user-avatar">赵</span><span class="user-name small" id="user-name">赵文彪</span></div></div></header>
<main class="main" aria-label="作业"><div class="minimal-toolbar"><div class="filters" id="filters"></div><div class="row"><select id="course-filter" aria-label="筛选课程" onchange="courseFilter=this.value;render()"><option value="all">全部课程</option><option>操作系统</option><option>数据库原理</option><option>计算机网络</option></select><button class="btn primary" id="new-task" onclick="openNew()" hidden>__PLUS_ICON__ 发布作业</button></div></div><div id="workspace"></div><footer class="preview-bottom"><span>示例数据 · 文件不会上传</span><span>计算机24-3</span></footer></main>
<dialog class="dialog" id="new-dialog" aria-labelledby="new-heading"><form id="new-form"><div class="dialog-head"><h2 id="new-heading">发布作业</h2><button type="button" class="btn icon-btn ghost" aria-label="关闭发布窗口" onclick="closeDialog('new-dialog')">__CLOSE_ICON__</button></div><div class="dialog-body"><div class="two-fields"><div class="field"><label for="new-course">课程</label><select id="new-course"><option>操作系统</option><option>数据库原理</option><option>计算机网络</option></select></div><div class="field"><label for="new-number">实验编号</label><input type="number" id="new-number" min="1" max="99" value="1" required></div></div><div class="field"><label for="new-name">实验名称 <span class="faint">（可不填）</span></label><input id="new-name" type="text" placeholder="如：进程调度" maxlength="60"></div><div class="field"><label for="new-due">截止时间</label><input id="new-due" type="datetime-local" value="2026-11-15T23:59" required></div><div class="form-rule"><div class="field"><label for="new-class">班级</label><input id="new-class" type="text" value="计算机24-3" oninput="updateExample()" required></div><span class="field-label">文件命名规则</span><div class="order-options"><label class="order-option"><input type="radio" name="naming-order" value="class-id-name" checked onchange="updateExample()">班级-学号-姓名</label><label class="order-option"><input type="radio" name="naming-order" value="class-name-id" onchange="updateExample()">班级-姓名-学号</label></div><div class="rule-example">示例<code id="name-example"></code></div></div><div id="new-error" class="error" role="alert"></div></div><div class="dialog-footer"><button class="btn" type="button" onclick="closeDialog('new-dialog')">取消</button><button class="btn primary" type="submit">确认发布</button></div></form></dialog>
<dialog class="dialog drawer" id="collection-dialog" aria-labelledby="collection-title"><div class="dialog-head"><div><h2 id="collection-title"></h2><div class="row" id="collection-meta" style="margin-top:10px;gap:10px"></div></div><button class="btn icon-btn ghost" aria-label="关闭提交记录" onclick="closeDialog('collection-dialog')">__CLOSE_ICON__</button></div><div class="dialog-body" id="collection-body"></div></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>const ICONS=__ICONS__;
__FINAL_JS__</script></body></html>
